<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hospital Staff QR Code Scanner - React application for instant optical asset identification, live status verification, and authorized clinical action workflows for Beds, Rooms, Linen, and Equipment.">
  <meta name="theme-color" content="#070b14">
  <title>Staff QR Scanner | Smart Hospital Hygiene & Resource Intelligence</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core & Dedicated Scanner Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/structure.css">
  <link rel="stylesheet" href="css/linen.css">
  <link rel="stylesheet" href="css/qr.css">
  <link rel="stylesheet" href="css/scanner.css">
</head>
<body>
  <div class="app-layout" style="display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Top Glass Navigation Bar -->
    <header class="top-header" id="main-header">
      <div class="brand-section">
        <div class="brand-icon-wrapper" id="brand-logo-icon">
          <!-- Optical Scanner Camera Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 7V4h3M20 7V4h-3M4 17v3h3M20 17v3h-3M9 12h6" />
          </svg>
        </div>
        <div class="brand-text">
          <h1>CLINICAL QR SCANNER & ACTION TERMINAL</h1>
          <p>React Powered • Zero-PHI Architecture • Bed, Room & Linen Operations</p>
        </div>
      </div>

      <!-- Quick Platform Navigation -->
      <div class="header-actions">
        <a href="/" class="btn-secondary-action" style="text-decoration: none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          IoT Dashboard
        </a>
        <a href="/qr.html" class="btn-secondary-action" style="text-decoration: none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"></rect>
            <rect x="14" y="3" width="7" height="7"></rect>
            <rect x="14" y="14" width="7" height="7"></rect>
            <rect x="3" y="14" width="7" height="7"></rect>
          </svg>
          QR Asset Hub
        </a>
        <a href="/linen.html" class="btn-secondary-action" style="text-decoration: none;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <path d="M4 10h16M10 4v16"/>
          </svg>
          Linen Hub
        </a>
        <span class="btn-secondary-action" style="border-color: #61dafb; color: #61dafb; background: rgba(97, 218, 251, 0.15); font-weight: 700;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor">
            <circle cx="12" cy="12" r="3" />
            <ellipse cx="12" cy="12" rx="11" ry="4.5" fill="none" stroke="currentColor" stroke-width="1.5" />
          </svg>
          Scanner Terminal
        </span>
      </div>
    </header>

    <!-- Main Container Mounted by React -->
    <main class="main-wrapper" style="max-width: 1100px; margin: 0 auto; width: 100%; padding: 1.5rem 1.8rem; flex: 1;">
      <div id="react-qr-scanner-root">
        <!-- React 18 Application Mount Point -->
        <div style="text-align: center; padding: 4rem 2rem; color: var(--text-muted);">
          <div class="spinner" style="display: inline-block; width: 40px; height: 40px; border: 3px solid rgba(97, 218, 251, 0.2); border-top-color: #61dafb; border-radius: 50%; animation: spin 0.8s linear infinite;"></div>
          <p style="margin-top: 1rem; font-size: 0.95rem; color: #e2e8f0;">Initializing React QR Scanning Engine & Hardware Interfaces...</p>
        </div>
      </div>
    </main>
  </div>

  <!-- React 18 & ReactDOM 18 (Local Offline Vendor Bundle with Online Fallback) -->
  <script src="js/vendor/react.min.js"></script>
  <script>
    if (!window.React) {
      document.write('<script src="https://unpkg.com/react@18.2.0/umd/react.production.min.js"><\/script>');
    }
  </script>
  <script src="js/vendor/react-dom.min.js"></script>
  <script>
    if (!window.ReactDOM) {
      document.write('<script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js"><\/script>');
    }
  </script>

  <!-- Client QR Library & React Scanner Component -->
  <script src="js/qrcode.js"></script>
  <script src="js/reactScannerApp.js"></script>
</body>
</html>
