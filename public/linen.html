<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Hospital Linen & Laundry Lifecycle Intelligence - Comprehensive tracking of linen assets, wash cycles, bed assignments, hygiene statuses, and historical audit trail.">
  <meta name="theme-color" content="#070b14">
  <title>Linen & Laundry Lifecycle Intelligence | Smart Hospital Hygiene</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Core, Dashboard & Linen Stylesheets -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/structure.css">
  <link rel="stylesheet" href="css/linen.css">
</head>
<body>
  <div class="app-layout" style="display: flex; flex-direction: column; min-height: 100vh;">
    <!-- Top Glass Navigation Bar -->
    <header class="top-header" id="main-header">
      <div class="brand-section">
        <div class="brand-icon-wrapper" id="brand-logo-icon">
          <!-- Linen & Bed Shield Icon -->
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <path d="M4 10h16M10 4v16"/>
          </svg>
        </div>
        <div class="brand-text">
          <h1>HOSPITAL LINEN & LAUNDRY INTELLIGENCE</h1>
          <p>Asset Lifecycle, Bed Allocation, Hygiene Status, & Thermal Wash Verification</p>
        </div>
      </div>

      <!-- Quick Portal Navigation -->
      <div class="header-actions">
        <a href="/" class="btn-secondary-action" style="text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="15 18 9 12 15 6"/>
          </svg>
          IoT Telemetry Dashboard
        </a>
        <a href="/structure.html" class="btn-secondary-action" style="text-decoration: none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="4" y="2" width="16" height="20" rx="2" ry="2"/>
            <line x1="9" y1="22" x2="9" y2="22.01"/>
            <line x1="15" y1="22" x2="15" y2="22.01"/>
          </svg>
          Hospital Structure
        </a>
      </div>
    </header>

    <!-- Main Container -->
    <main class="main-wrapper" style="max-width: 1540px; margin: 0 auto; width: 100%; padding: 1.5rem 1.8rem; flex: 1;">
      <div id="standalone-linen-container">
        <!-- Injected by linenManager.js -->
      </div>
    </main>

    <!-- Floating Toast Container -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- JavaScript Modules -->
  <script src="js/linenManager.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      window.linenManager = new HospitalLinenManager('standalone-linen-container');
    });
  </script>
</body>
</html>
