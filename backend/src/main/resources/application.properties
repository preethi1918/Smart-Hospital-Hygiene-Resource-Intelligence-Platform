# ==============================================================================
# Smart Hospital Hygiene & Resource Intelligence Platform
# Core Application Properties (Environment-Aware)
# ==============================================================================

spring.application.name=smart-hospital-backend
server.port=8080

# Active Profile (Override via SPRING_PROFILES_ACTIVE environment variable)
spring.profiles.active=dev

# ------------------------------------------------------------------------------
# Default MySQL Database Configuration (Overridable via Environment Variables)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smart_hospital_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ------------------------------------------------------------------------------
# Spring Data JPA / Hibernate Configuration
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# ------------------------------------------------------------------------------
# HikariCP Connection Pool Settings
# ------------------------------------------------------------------------------
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1800000

# ------------------------------------------------------------------------------
# Actuator Health Endpoint Configuration
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
