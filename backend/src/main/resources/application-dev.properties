# Development Profile Properties
logging.level.root=INFO
logging.level.com.smarthospital=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# CORS Allowed Origins in Development
app.cors.allowed-origins=*

# Persistent local DB for development with MySQL compatibility mode
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/hospital_dev_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
