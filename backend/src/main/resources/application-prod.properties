# Production Profile Properties
logging.level.root=WARN
logging.level.com.smarthospital=INFO
logging.level.org.hibernate.SQL=ERROR

spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=validate

# Strict Production Connection Pool
spring.datasource.hikari.maximum-pool-size=25
spring.datasource.hikari.minimum-idle=5

# CORS Allowed Origins in Production
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://hospital-intelligence.org}
